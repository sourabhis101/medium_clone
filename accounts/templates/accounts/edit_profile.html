{% extends 'pages/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_profile_image">Profile Image</label>
            {% if form.instance.profile_image %}
                <img src="{{ form.instance.profile_image.url }}" width="64" class="mt-2">
            {% endif %}
            {{ form.profile_image }}
           
        </div>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" value="{{ request.user.username }}" readonly>
        </div>

        <div class="form-group">
            <label for="id_full_name">Full Name</label>
            {{ form.full_name }}
        </div>

        <div class="form-group">
            <label for="id_bio">Bio</label>
            {{ form.bio }}
        </div>

        

        <button type="submit" class="btn btn-primary mt-3">Update Profile</button>
        <a href="{% url 'my_profile' %}"  class="btn btn-outline-primary mt-3 ">Cancel</a>
        
    </form>
</div>
{% endblock %}
