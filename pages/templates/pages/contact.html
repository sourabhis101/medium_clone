<!-- contact -->
{% extends 'pages/base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<style>
  .container-fluid {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    padding: 40px;
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  }

  .contact-form,
  .contact-info {
    flex: 1 1 400px;
  }

  .contact-form h2,
  .contact-info h2 {
    font-size: 24px;
    margin-bottom: 20px;
  }

  .contact-form form {
    display: flex;
    flex-direction: column;
  }

  .contact-form input,
  .contact-form textarea {
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
    width: 100%;
  }

  .contact-form textarea {
    resize: vertical;
    min-height: 120px;
  }

  .contact-form button {
    background-color: #003cff;
    color: white;
    border: none;
    padding: 12px;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;

  }

  .contact-form button:hover {
    background-color: #002bbb;
  }

  .contact-info p {
    margin: 10px 0;
    font-size: 15px;
  }

  .contact-info .icon {
    margin-right: 10px;
    color: #003cff;
  }

  .social-icons a {
    margin-right: 15px;
    font-size: 18px;
    color: #333;
    transition: color 0.3s ease;
  }

  .social-icons a:hover {
    color: #003cff;
  }
</style>

<div class="container-fluid">
  <!-- Contact Form -->
  <div class="contact-form">
    <h2>Send Us a Message</h2>
    <form method="post" action="/contact/">
      {% csrf_token %}
      <div class="form-floating"><input name="name" class="form-control" id="name" placeholder="Name" required>
        <label for="name">Name</label>
      </div>
      <div class="form-floating"><input name="email" class="form-control" id="email" placeholder="Email address"
          required>
        <label for="email">Email address</label>
      </div>
      <div class="form-floating"><input name="phone" class="form-control" id="phone" placeholder="Phone number"
          required>
        <label for="phone">Phone number</label>
      </div>

      <div class="form-floating"><input name="subject" class="form-control" id="subject" placeholder="Subject" required>
        <label for="subject">Subject</label>
      </div>

      <textarea name="message" placeholder="Tell me your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- Contact Info -->
  <div class="contact-info">
    <h2>Contact Information</h2>
    <p><i class="fas fa-envelope icon"></i> contact@mediumclone.com</p>
    <p><i class="fas fa-phone icon"></i> +91-98765-43210</p>
    <p><i class="fas fa-map-marker-alt icon"></i> New Delhi, India</p>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d224345.89796785527!2d77.04417053579648!3d28.527554410196217!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1754287369356!5m2!1sen!2sin"
      width="450" height="450"  style="display: block; margin: 0 auto; border:0;"  allowfullscreen="" loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"></iframe>

    <div class="social-icons" style="margin-top: 20px;">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </div>
</div>
{% endblock %}
